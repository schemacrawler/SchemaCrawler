database-connector:
  database-server-type:
    server: hive
    name: Apache Hive
  url-template: "jdbc:hive2://${host}:${port}/${database}"
  allowed-driver-properties:
    - auth
    - httpPath
    - transportMode
    - principal
    - user
    - password
    - ssl
    - sslTrustStore
    - sslTrustStorePassword
    - sslTrustStoreType
    - sslKeyStore
    - sslKeyStorePassword
    - sslKeyStoreType
    - socketTimeout
  standard-options:
    host:
      help:
        - Host name
        - "Optional, defaults to localhost"
    port:
      default: 10000
      help:
        - Port number
        - "Optional, defaults to 10000"
    database:
      help:
        - Hive database name
  schema-retrieval: {}
  limit:
    exclude-schemas: information_schema|sys
