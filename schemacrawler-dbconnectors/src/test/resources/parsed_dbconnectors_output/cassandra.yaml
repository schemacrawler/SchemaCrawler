database-connector:
  database-server-type:
    server: cassandra
    name: Cassandra
  url-template: "jdbc:cassandra://${host}:${port}/${database}?localdatacenter=${localdatacenter}"
  allowed-driver-properties:
    - localdatacenter
    - enablessl
    - compliancemode
    - consistency
    - loadbalancing
    - requesttimeout
  standard-options:
    host:
      help:
        - Host name
        - "Optional, defaults to localhost"
        - Can be a list of hosts separated with '--'
        - See https://github.com/ing-bank/cassandra-jdbc-wrapper
    port:
      default: 9042
      help:
        - Port number
        - "Optional, defaults to 9042"
    database:
      help:
        - Keyspace name
  additional-options:
    - name: localdatacenter
      type: string
      default: datacenter1
      help:
        - Tells the load-balancing policy which local datacenter nodes to route queries
          to.
        - "Optional, defaults to datacenter1"
    - name: consistency
      type: string
      default: LOCAL_ONE
      help:
        - Consistency level
        - "Optional, defaults to LOCAL_ONE"
  schema-retrieval: {}
  limit: {}
