database-connector:
  database-server-type:
    server: hive
    name: Apache Hive
  url-template: "jdbc:hive2://${host}:${port}/${database}"
  allowed-driver-properties:
    # Authentication mode for HTTP or SASL deployments.
    - auth
    # HTTP transport path when transportMode=http.
    - httpPath
    # Transport mode (for example binary or http).
    - transportMode
    # Kerberos service principal.
    - principal
    # Client username for authenticated deployments.
    - user
    # Client password for authenticated deployments.
    - password
    # TLS enablement.
    - ssl
    # Trust store path for TLS.
    - sslTrustStore
    # Trust store password for TLS.
    - sslTrustStorePassword
    # Trust store type for TLS.
    - sslTrustStoreType
    # Keystore path for TLS client auth.
    - sslKeyStore
    # Keystore password for TLS client auth.
    - sslKeyStorePassword
    # Keystore type for TLS client auth.
    - sslKeyStoreType
    # JDBC session timeout.
    - socketTimeout
  standard-options:
    host:
      help:
        - Host name
        - Optional, defaults to localhost
    port:
      help:
        - Port number
        - Optional, defaults to 10000
      default: 10000
    database:
      help:
        - Hive database name
  limit:
    exclude-schemas: "information_schema|sys"
