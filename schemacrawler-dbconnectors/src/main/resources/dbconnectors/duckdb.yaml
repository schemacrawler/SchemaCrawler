database-connector:
  database-server-type:
    server: duckdb
    name: DuckDB
  url-template: "jdbc:duckdb:${database}"
  allowed-driver-properties:
    # Opens the database in read-only mode.
    - duckdb.read_only
    # Directory for temporary spill files.
    - temp_directory
    # Maximum number of worker threads.
    - threads
    # Memory budget (for example 1GB, 512MB).
    - memory_limit
  standard-options:
    host:
      help:
        - Should be omitted
    port:
      help:
        - Should be omitted
    database:
      help:
        - "DuckDB database file path, or :memory:"
  schema-retrieval:
    retrieval-strategies:
      table-columns: metadata-over-schemas
  limit:
    exclude-schemas: "information_schema|pg_catalog"
