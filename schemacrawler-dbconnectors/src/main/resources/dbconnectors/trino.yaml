database-connector:
  database-server-type:
    server: trino
    name: Trino
  url-template: "jdbc:trino://${host}:${port}/${database}"
  allowed-driver-properties:
    # Session-level impersonation user.
    - sessionUser
    # TLS enablement and verification behavior.
    # SSLVerification supports FULL, CA, or NONE.
    - SSL
    - SSLVerification
    # TLS trust/key store paths, passwords, and formats.
    - SSLTrustStorePath
    - SSLTrustStorePassword
    - SSLTrustStoreType
    - SSLUseSystemTrustStore
    - SSLKeyStorePath
    - SSLKeyStorePassword
    - SSLKeyStoreType
    - SSLUseSystemKeyStore
    # Expected hostname in presented certificate.
    - hostnameInCertificate
    # Client metadata and tracing properties.
    - applicationNamePrefix
    - clientInfo
    - clientTags
    - traceToken
    - source
    - path
    # JVM/session time zone selection.
    - timezone
    # HTTP/SOCKS proxy configuration.
    - httpProxy
    - socksProxy
    # Metadata pattern handling workaround for non-conforming clients.
    - assumeLiteralUnderscoreInMetadataCallsForNonConformingClients
    # Controls HTTP compression and redirect behavior.
    - disableCompression
    - disallowLocalRedirect
    # Catalog/session-level dynamic configuration.
    - extraCredentials
    - roles
    - sessionProperties
    - extraHeaders
    # Authentication extensions.
    - accessToken
    - externalAuthentication
    - externalAuthenticationTokenCache
    # Kerberos settings (property names are case-sensitive).
    - KerberosServicePrincipalPattern
    - KerberosPrincipal
    - KerberosRemoteServiceName
    - KerberosUseCanonicalHostname
    - KerberosConfigPath
    - KerberosKeytabPath
    - KerberosCredentialCachePath
    - KerberosDelegation
    # Prepared statement/transport tuning.
    - explicitPrepare
    - encoding
    - validateConnection
  standard-options:
    port:
      default: 8080
  schema-retrieval:
    retrieval-strategies:
      indexes: none
  limit:
    exclude-schemas: "INFORMATION_SCHEMA"
