database-connector:
  database-server-type:
    server: snowflake
    name: Snowflake
  url-template: "jdbc:snowflake://${host}:${port}/"
  allowed-driver-properties:
    # Default database after authentication.
    - db
    # Default schema within the selected database.
    - schema
    # Virtual warehouse for query execution.
    - warehouse
    # Default role for the session.
    - role
    # Keeps session alive while the connection is idle.
    - CLIENT_SESSION_KEEP_ALIVE
    # Private key contents for key-pair authentication.
    - privateKey
    # Private key file path for key-pair authentication.
    - privateKeyFile
    # Auth mode (snowflake, externalbrowser, oauth, snowflake_jwt, etc.).
    - authenticator
    # Login timeout in seconds.
    - loginTimeout
    # Network timeout for socket-level operations.
    - networkTimeout
    # Query timeout in seconds.
    - queryTimeout
    # Driver logging/tracing level.
    - tracing
    # Proxy host for outbound connections.
    - proxyHost
    # Proxy port for outbound connections.
    - proxyPort
  standard-options:
    host:
      help:
        - Snowflake account identifier (e.g. myorg-myaccount.snowflakecomputing.com)
    port:
      help:
        - Port number
        - Optional, defaults to 443
      default: 443
    database:
      help:
        - Snowflake database name
  additional-options:
    - name: db
      type: string
      help:
        - Specifies the default database to use once connected. 
        - The specified database should be an existing database for which the specified default role has privileges.
        - Optional
    - name: schema
      type: string
      help:
        - Specifies the default schema to use for the specified database once connected. 
        - The specified schema should be an existing schema for which the specified default role has privileges.
        - Optional
    - name: warehouse
      type: string
      help:
        - Specifies the virtual warehouse to use once connected. 
        - The specified warehouse should be an existing warehouse for which the specified default role has privileges.
        - Optional
    - name: role
      type: string
      help:
        - Specifies the default access control role. 
        - The specified role should be an existing role that has already been assigned to the specified user.
        - Optional
  limit:
    exclude-schemas: "INFORMATION_SCHEMA"
