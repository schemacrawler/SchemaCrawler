database-connector:
  database-server-type:
    server: oracle
    name: Oracle
  url-template: "jdbc:oracle:thin:@//${host}:${port}/${database}"
  standard-options:
    host:
      help:
        - Host name
        - Optional, defaults to localhost
    port:
      help:
        - Port number
        - Optional, defaults to 1521
      default: 1521
    database:
      help:
        - Oracle Service Name
        - You can use a query similar to the one below to find it.
        - SELECT GLOBAL_NAME FROM GLOBAL_NAME
  schema-retrieval:
    retrieval-strategies:
      typeinfo: data_dictionary_all
      tables: data_dictionary_all
      tablecolumns: data_dictionary_all
      primarykeys: data_dictionary_all
      foreignkeys: data_dictionary_all
      indexes: data_dictionary_all
      procedures: data_dictionary_all
      procedureparameters: data_dictionary_all
      functions: data_dictionary_all
      functionparameters: data_dictionary_all
  additional-options:
    - name: remarksReporting
      type: boolean
      default: "true"
      help:
        - Report REMARKS for tables and columns
        - Optional, defaults to true
    - name: restrictGetTables
      type: boolean
      default: "true"
      help:
        - Restrict getTables() to accessible objects
        - Optional, defaults to true
    - name: useFetchSizeWithLongColumn
      type: boolean
      default: "true"
      help:
        - Use fetch size hint when LONG columns are present
        - Optional, defaults to true
