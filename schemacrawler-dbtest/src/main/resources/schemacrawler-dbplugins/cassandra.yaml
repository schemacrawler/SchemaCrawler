plugin:
  server: cassandra
  name: Cassandra
  url-template: "jdbc:cassandra://${host}:${port}/${database}"
  url-prefix: "jdbc:cassandra:"
  default-port: 9042
  default-url-properties:
    consistency: "LOCAL_ONE"
  allowed-driver-properties:
    - consistency
    - loadbalancing
    - version
    - contactPoints
    - port
    - localdatacenter
    - localDataCenter
    - username
    - password
    - authProvider
    - sslOptions
    - fetchSize
    - connectTimeout
    - readTimeout
    - compression
    - maxSchemaAgreementWaitSeconds
    - reconnectionPolicy
    - retryPolicy
    - requestTracker
    - asyncQueryTimeout
    - keyspace
  additional-options:
    - name: consistency
      type: String
      urlx-key: consistency
      help:
        - Consistency level
        - Optional, defaults to LOCAL_ONE
  help:
    server:
      - --server=cassandra
      - Loads SchemaCrawler plug-in for Cassandra
    host:
      - Host name
      - Optional, defaults to localhost
      - Can be a list of hosts separated with '--'
      - See https://github.com/ing-bank/cassandra-jdbc-wrapper
    port:
      - Port number
      - Optional, defaults to 9042
    database:
      - Keyspace name
  schema-retrieval:
    foreign-keys-retrieval-strategy: none
    procedures-retrieval-strategy: none
    functions-retrieval-strategy: none
  schema-support:
    supports-catalogs: auto
    supports-schemas: auto
