database-connector:
  database-server-type:
    server: cassandra
    name: Cassandra
  url-template: "jdbc:cassandra://${host}:${port}/${database}"
  url-prefix: "jdbc:cassandra:"
  allowed-driver-properties:
    - consistency
    - loadbalancing
    - version
    - contactPoints
    - port
    - localdatacenter
    - localDataCenter
    - username
    - password
    - authProvider
    - sslOptions
    - fetchSize
    - connectTimeout
    - readTimeout
    - compression
    - maxSchemaAgreementWaitSeconds
    - reconnectionPolicy
    - retryPolicy
    - requestTracker
    - asyncQueryTimeout
    - keyspace
standard-options:
  server:
    help:
      - --server=cassandra
      - Loads SchemaCrawler plug-in for Cassandra
  host:
    help:
      - Host name
      - Optional, defaults to localhost
      - Can be a list of hosts separated with '--'
      - See https://github.com/ing-bank/cassandra-jdbc-wrapper
  port:
    help:
      - Port number
      - Optional, defaults to 9042
    default: 9042
  database:
    help:
      - Keyspace name
additional-options:
  - name: consistency
    type: String
    default: LOCAL_ONE
    help:
      - Consistency level
      - Optional, defaults to LOCAL_ONE
schema-retrieval:
  supports-catalogs: auto
  supports-schemas: auto
  foreign-keys-retrieval-strategy: none
  procedures-retrieval-strategy: none
  functions-retrieval-strategy: none
