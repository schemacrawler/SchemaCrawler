database-connector:
  database-server-type:
    server: cassandra
    name: Cassandra
  url-template: "jdbc:cassandra://${host}:${port}/${database}"
  url-prefix: "jdbc:cassandra:"
  allowed-driver-properties:
    - consistency
    - loadbalancing
    - version
    - contactPoints
    - port
    - localdatacenter
    - localDataCenter
    - username
    - password
    - authProvider
    - sslOptions
    - fetchSize
    - connectTimeout
    - readTimeout
    - compression
    - maxSchemaAgreementWaitSeconds
    - reconnectionPolicy
    - retryPolicy
    - requestTracker
    - asyncQueryTimeout
    - keyspace
  standard-options:
    host:
      help:
        - Host name
        - Optional, defaults to localhost
        - Can be a list of hosts separated with '--'
        - See https://github.com/ing-bank/cassandra-jdbc-wrapper
    port:
      help:
        - Port number
        - Optional, defaults to 9042
      default: 9042
    database:
      help:
        - Keyspace name
  additional-options:
    - name: consistency
      type: string
      default: LOCAL_ONE
      help:
        - Consistency level
        - Optional, defaults to LOCAL_ONE
  schema-retrieval:
    retrieval-strategies:
      foreignkeys: none
      procedures: none
      functions: none
