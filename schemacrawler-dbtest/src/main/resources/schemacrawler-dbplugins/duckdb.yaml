database-connector:
  database-server-type:
    server: duckdb
    name: DuckDB
  url-template: "jdbc:duckdb:${database}"
  url-prefix: "jdbc:duckdb:"
  allowed-driver-properties:
    - duckdb.read_only
    - user
    - password
    - temp_directory
    - threads
    - memory_limit
  standard-options:
    host:
      help:
        - Should be omitted
    port:
      help:
        - Should be omitted
    database:
      help:
        - "DuckDB database file path, or :memory:"
  additional-options:
    - name: duckdb.read_only
      type: boolean
      default: false
  schema-retrieval:
    strategies:
      table-columns-retrieval-strategy: metadata-over-schemas
  limit:
    exclude-schemas: "information_schema|pg_catalog"
