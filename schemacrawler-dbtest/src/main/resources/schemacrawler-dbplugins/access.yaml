database-connector:
  database-server-type:
    server: access
    name: Microsoft Access
  url-template: "jdbc:ucanaccess://${database}"
  url-prefix: "jdbc:ucanaccess:"
  allowed-driver-properties:
    - memory
    - showSchema
    - sysSchema
    - singleConnection
    - columnOrder
    - ignoreCase
    - lobScale
    - maxMemoFieldLength
    - concatNulls
    - immediatelyReleaseResources
    - jackcessOpener
    - openMode
    - inactivityTimeout
    - password
    - newDatabaseVersion
  standard-options:
    database:
      help:
        - Database file
  additional-options:
    - name: memory
      type: boolean
      default: false
      help:
        - Load database into memory
        - Optional, defaults to false
    - name: showSchema
      type: boolean
      default: true
    - name: sysSchema
      type: boolean
      default: true
