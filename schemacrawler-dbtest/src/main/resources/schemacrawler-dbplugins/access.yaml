database-connector:
  database-server-type:
    server: access
    name: Microsoft Access
  url-template: "jdbc:ucanaccess://${database}"
  url-prefix: "jdbc:ucanaccess:"
  allowed-driver-properties:
    - memory
    - showSchema
    - sysSchema
    - singleConnection
    - columnOrder
    - ignoreCase
    - lobScale
    - maxMemoFieldLength
    - concatNulls
    - immediatelyReleaseResources
    - jackcessOpener
    - openMode
    - inactivityTimeout
    - password
    - newDatabaseVersion
standard-options:
  server:
    help:
      - --server=access
      - Loads SchemaCrawler plug-in for Microsoft Access
  database:
    help:
      - Database file
additional-options:
  - name: memory
    type: Boolean
    urlx-key: memory
    default: false
    help:
      - Load database into memory
      - Optional, defaults to false
  - name: showSchema
    type: Boolean
    urlx-key: showSchema
    default: true
  - name: sysSchema
    type: Boolean
    urlx-key: sysSchema
    default: true
schema-retrieval:
  supports-catalogs: auto
  supports-schemas: auto
