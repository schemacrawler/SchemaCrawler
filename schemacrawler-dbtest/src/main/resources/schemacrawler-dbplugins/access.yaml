database-connector:
  database-server-type:
    server: access
    name: Microsoft Access
  url-template: "jdbc:ucanaccess://${database};showSchema=true;sysSchema=true"
  url-prefix: "jdbc:ucanaccess:"
  allowed-driver-properties:
    - memory
    - singleConnection
    - columnOrder
    - ignoreCase
    - lobScale
    - maxMemoFieldLength
    - concatNulls
    - immediatelyReleaseResources
    - jackcessOpener
    - openMode
    - inactivityTimeout
    - password
    - newDatabaseVersion
  standard-options:
    database:
      help:
        - Database file
