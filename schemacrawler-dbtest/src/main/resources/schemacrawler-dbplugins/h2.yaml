database-connector:
  database-server-type:
    server: h2
    name: H2
  url-template: "jdbc:h2:${database}"
  url-prefix: "jdbc:h2:"
  allowed-driver-properties:
    - MODE
    - AUTO_SERVER
    - AUTO_RECONNECT
    - DATABASE_TO_UPPER
    - DATABASE_TO_LOWER
    - DEFAULT_NULL_ORDERING
    - TRACE_LEVEL_FILE
    - TRACE_LEVEL_SYSTEM_OUT
    - INIT
    - IFEXISTS
    - ACCESS_MODE_DATA
    - FILE_LOCK
    - user
    - password
standard-options:
  server:
    help:
      - --server=h2
      - Loads SchemaCrawler plug-in for H2
  host:
    help:
      - Should be omitted
  port:
    help:
      - Should be omitted
  database:
    help:
      - H2 JDBC database path (for example ~/test or mem:test)
additional-options:
  - name: MODE
    type: String
    default: REGULAR
    help:
      - H2 compatibility mode (for example PostgreSQL, MySQL, Oracle)
schema-retrieval:
  supports-catalogs: auto
  supports-schemas: auto
limit:
  exclude-schemas: "INFORMATION_SCHEMA"
