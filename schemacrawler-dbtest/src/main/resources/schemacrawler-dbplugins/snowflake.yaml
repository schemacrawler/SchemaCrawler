database-connector:
  database-server-type:
    server: snowflake
    name: Snowflake
  url-template: "jdbc:snowflake://${host}:${port}/"
  url-prefix: "jdbc:snowflake:"
  allowed-driver-properties:
    - db
    - schema
    - warehouse
    - role
    - CLIENT_SESSION_KEEP_ALIVE
    - user
    - password
    - privateKey
    - privateKeyFile
    - authenticator
    - loginTimeout
    - networkTimeout
    - queryTimeout
    - tracing
    - proxyHost
    - proxyPort
standard-options:
  server:
    help:
      - --server=snowflake
      - Loads SchemaCrawler plug-in for Snowflake
  host:
    help:
      - Snowflake account identifier (e.g. myorg-myaccount.snowflakecomputing.com)
  port:
    help:
      - Port number
      - Optional, defaults to 443
    default: 443
  database:
    help:
      - Snowflake database name
additional-options:
  - name: warehouse
    type: String
    urlx-key: warehouse
    default: null
    help:
      - Snowflake virtual warehouse name
      - Optional
  - name: role
    type: String
    urlx-key: role
    default: null
    help:
      - Snowflake role name
      - Optional
  - name: db
    type: String
    urlx-key: db
    default: "${database}"
  - name: CLIENT_SESSION_KEEP_ALIVE
    type: Boolean
    urlx-key: CLIENT_SESSION_KEEP_ALIVE
    default: true
schema-retrieval:
  supports-catalogs: auto
  supports-schemas: auto
limit:
  exclude-schemas: "INFORMATION_SCHEMA"
