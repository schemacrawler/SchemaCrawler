database-connector:
  database-server-type:
    server: snowflake
    name: Snowflake
  url-template: "jdbc:snowflake://${host}:${port}/"
  url-prefix: "jdbc:snowflake:"
  allowed-driver-properties:
    - db
    - schema
    - warehouse
    - role
    - CLIENT_SESSION_KEEP_ALIVE
    - user
    - password
    - privateKey
    - privateKeyFile
    - authenticator
    - loginTimeout
    - networkTimeout
    - queryTimeout
    - tracing
    - proxyHost
    - proxyPort
  standard-options:
    host:
      help:
        - Snowflake account identifier (e.g. myorg-myaccount.snowflakecomputing.com)
    port:
      help:
        - Port number
        - Optional, defaults to 443
      default: 443
    database:
      help:
        - Snowflake database name
  additional-options:
    - name: db
      type: string
    - name: schema
      type: string
      help:
        - Snowflake schema name
        - Optional  
    - name: warehouse
      type: string
      help:
        - Snowflake virtual warehouse name
        - Optional
    - name: role
      type: string
      help:
        - Snowflake role name
        - Optional
    - name: CLIENT_SESSION_KEEP_ALIVE
      type: boolean
      default: true
  limit:
    exclude-schemas: "INFORMATION_SCHEMA"
