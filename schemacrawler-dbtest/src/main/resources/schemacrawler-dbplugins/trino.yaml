database-connector:
  database-server-type:
    server: trino
    name: Trino
  url-template: "jdbc:trino://${host}:${port}/${database}"
  url-prefix: "jdbc:trino:"
  allowed-driver-properties:
    - user
    - password
    - sessionUser
    - SSL
    - SSLVerification
    - SSLTrustStorePath
    - SSLTrustStorePassword
    - SSLTrustStoreType
    - SSLKeyStorePath
    - SSLKeyStorePassword
    - SSLKeyStoreType
    - applicationNamePrefix
    - clientInfo
    - clientTags
    - traceToken
    - timezone
    - locale
    - queryInterceptors
    - httpProxy
    - socksProxy
    - assumeLiteralNamesInMetadataCallsForNonConformingClients
    - assumeLiteralUnderscoreInMetadataCallsForNonConformingClients
    - disableCompression
    - extraCredentials
    - roles
    - sessionProperties
    - protocols
    - accessToken
    - externalAuthentication
    - kerberosEnabled
    - kerberosServicePrincipalPattern
    - kerberosPrincipal
    - kerberosRemoteServiceName
    - kerberosUseCanonicalHostname
    - kerberosConfigPath
    - kerberosKeytabPath
    - kerberosCredentialCachePath
    - kerberosDelegation
    - httpLoggingLevel
  standard-options:
    server:
      help:
        - --server=trino
        - Loads SchemaCrawler plug-in for Trino
    port:
      default: 8080
  additional-options:
    - name: user
      type: string
      help:
        - Trino user name
        - Optional
    - name: SSL
      type: boolean
      default: false
      help:
        - Enable SSL
        - Optional, defaults to false
  schema-retrieval:
    strategies:
      indexes-retrieval-strategy: none
  limit:
    exclude-schemas: "INFORMATION_SCHEMA"
