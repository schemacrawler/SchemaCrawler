database-connector:
  database-server-type:
    server: hsqldb
    name: HyperSQL DataBase
  url-template: "jdbc:hsqldb:hsql://${host}:${port}/${database}"
  url-prefix: "jdbc:hsqldb:"
  standard-options:
    host:
      help:
        - Host name
        - Optional, defaults to localhost
    port:
      help:
        - Port number
        - Optional, defaults to 9001
      default: 9001
    database:
      help:
        - Database name
  schema-retrieval:
    retrieval-strategies:
      tablecolumnprivileges: data_dictionary_all
  additional-options:
    - name: readonly
      type: boolean
      default: "true"
      help:
        - Open connection in read-only mode
        - Optional, defaults to true
    - name: hsqldb.lock_file
      type: boolean
      default: "false"
      help:
        - Use a lock file for the database
        - Optional, defaults to false
